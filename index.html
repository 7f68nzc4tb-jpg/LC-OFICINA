<body>
  <div class="app">
    <aside id="sidebar" class="sidebar"><div class="brand"><div class="brand-mark">LC</div><div><strong>LC Oficina</strong><small>GESTÃO INTELIGENTE</small></div></div><div class="nav-title">MENU PRINCIPAL</div><nav id="nav" class="nav"></nav><div class="side-bottom"><div class="owner-badge"><strong>Luís Carlos & José Edivaldo</strong><small>Sociedade igualitária: 50% / 50%</small></div></div></aside>
    <div id="shade" class="shade" onclick="toggleSidebar(false)"></div>
    <main class="main"><header class="topbar"><button id="menuButton" onclick="toggleSidebar(true)" aria-label="Abrir menu">☰</button><div class="search">⌕ &nbsp; Gestão da oficina, clientes e serviços</div><div class="right-top"><span class="demo-pill">● VERSÃO INICIAL LOCAL</span><span class="avatar">LC</span></div></header><div id="content" class="content"></div></main>
  </div>
  <div id="modalRoot"></div><div id="toastRoot"></div><div id="printSheet" class="print-sheet"></div>
<script>
'use strict';
const KEY='lc-oficina-v1';
const iconPaths={dashboard:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',quote:'<path d="M8 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9l-6-6H8z"/><path d="M14 3v6h6M8 13h8M8 17h6"/>',stock:'<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/>',money:'<rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 12h.01M18 12h.01"/>',inspect:'<rect x="5" y="4" width="14" height="18" rx="2"/><path d="M9 4.5V3h6v1.5M9 12l2 2 4-4M9 18h6"/>',clients:'<circle cx="9" cy="8" r="3"/><path d="M3 21v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6M17 15a5 5 0 0 1 4 5"/>',settings:'<path d="M4 6h16M4 12h16M4 18h16"/>',plus:'<path d="M12 5v14M5 12h14"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',tool:'<path d="M14.7 6.3a5 5 0 0 0-6.4 6.4L3 17.6V21h3.4l5.3-5.3a5 5 0 0 0 6.4-6.4l-3.3 3.3-3.4-3.4 3.3-3.3Z"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M5 17v4h14v-4"/>',trend:'<path d="m3 17 6-6 4 4 8-9M14 6h7v7"/>',bike:'<circle cx="5" cy="17" r="3"/><circle cx="19" cy="17" r="3"/><path d="M5 17l4-9h5l5 9M12 12h6M7 8h4"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>'};
const ic=(name)=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(iconPaths[name]||iconPaths.dashboard)+'</svg>';
const menus=[['dashboard','Visão Geral'],['quote','Orçamentos'],['stock','Estoque'],['money','Financeiro'],['inspect','Vistorias de Motos'],['clients','Clientes'],['settings','Dados e Backup']];
const newDB=()=>({customers:[],quotes:[],stock:[],finances:[],inspections:[],nextId:1});
let db;try{db=JSON.parse(localStorage.getItem(KEY)||'null')||newDB()}catch(e){db=newDB()}
for(const k of ['customers','quotes','stock','finances','inspections'])if(!Array.isArray(db[k]))db[k]=[];
if(!Number.isSafeInteger(db.nextId))db.nextId=1;
let page='dashboard',search='',statusFilter='all';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Espaço local insuficiente. Exporte um backup.')}};
const id=()=>db.nextId++;
const money=(n)=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const date=(d)=>{if(!d)return '—';const str=String(d).slice(0,10);const v=str.split('-');return v.length===3?`${v[2]}/${v[1]}/${v[0]}`:str};
const now=()=>new Date().toISOString().slice(0,10);
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const attr=esc;
function toast(s){const root=document.getElementById('toastRoot');root.innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>{root.innerHTML=''},3300)}
function toggleSidebar(open){document.getElementById('sidebar').classList.toggle('open',open);document.getElementById('shade').classList.toggle('show',open)}
function goto(p){page=p;search='';statusFilter='all';toggleSidebar(false);render();window.scrollTo({top:0,behavior:'smooth'})}
function renderNav(){document.getElementById('nav').innerHTML=menus.map(([key,title])=>`<button class="${page===key?'active':''}" onclick="goto('${key}')">${ic(key)}<span>${title}</span></button>`).join('')}
function heading(ey,title,sub,action='',handler=''){return `<div class="heading"><div><div class="eyebrow">${ey}</div><h1>${title}</h1><p>${sub}</p></div>${action?`<button class="btn btn-primary" onclick="${handler}">+ ${action}</button>`:''}</div>`}
function metric(title,value,icon,sub,color=''){return `<div class="card metric"><div class="metric-icon ${color}">${ic(icon)}</div><small>${title}</small><b>${value}</b><em>${sub}</em></div>`}
const statusHtml=(s)=>{let cls=(['Aprovado','Concluído','Pago','Disponível','OK'].includes(s))?'done':(['Pendente','Atenção','Baixo'].includes(s))?'attention':(['Urgente','Vencido','Reprovado'].includes(s))?'urgent':'';return `<span class="status ${cls}">${esc(s)}</span>`};
const empty=(t,sub='Use o botão acima para adicionar um registro.')=>`<div class="empty"><b>${t}</b>${sub}</div>`;
const actions=(records,renderRow,columns,thead)=>`<div class="table-wrap"><table><thead><tr>${thead.map(s=>`<th>${s}</th>`).join('')}</tr></thead><tbody>${records.map(renderRow).join('')}</tbody></table></div>`;
const totalQuote=(q)=>q.items.reduce((a,i)=>a+Number(i.qty)*Number(i.price),0)-Number(q.discount||0);
function renderDashboard(){const inflow=db.finances.filter(f=>f.type==='Entrada').reduce((s,f)=>s+Number(f.value),0),outflow=db.finances.filter(f=>f.type==='Saída').reduce((s,f)=>s+Number(f.value),0),net=inflow-outflow, pending=db.quotes.filter(q=>q.status==='Pendente').length,attention=db.inspections.filter(i=>['Atenção','Urgente'].includes(i.priority)).length;
let recent=[...db.quotes].sort((a,b)=>b.id-a.id).slice(0,5);
return heading('VISÃO GERAL','Olá, equipe LC! 👋','Acompanhe o desempenho e as atividades da oficina.', 'Novo Orçamento','openModal("quote")')+`<div class="cards">${metric('Saldo operacional',money(net),'money','Entradas menos saídas')}${metric('Orçamentos pendentes',pending,'quote','Aguardando aprovação','orange')}${metric('Produtos em estoque',db.stock.length,'stock','Itens cadastrados','purple')}${metric('Motos que exigem atenção',attention,'bike','Vistorias com alerta','green')}</div><div class="quick-actions"><button class="btn btn-light" onclick="openModal('inspect')">${ic('inspect')} Nova vistoria</button><button class="btn btn-light" onclick="openModal('money')">${ic('money')} Lançamento financeiro</button><button class="btn btn-light" onclick="openModal('stock')">${ic('stock')} Novo produto</button></div><div class="dashboard-grid"><div class="panel"><div class="panel-head"><div><h2>Últimos orçamentos</h2><small>Acompanhe seus atendimentos</small></div><button class="mini-action" onclick="goto('quote')">Ver todos →</button></div>${recent.length?actions(recent,q=>`<tr><td><strong>#${q.id}</strong></td><td>${esc(q.customer)}</td><td>${date(q.date)}</td><td>${money(totalQuote(q))}</td><td>${statusHtml(q.status)}</td></tr>`,[],['Nº','Cliente','Data','Valor','Status']):empty('Ainda não há orçamentos','Crie o primeiro orçamento para começar.')}</div><div class="panel"><div class="panel-head"><div><h2>Divisão societária</h2><small>Participação de cada proprietário</small></div><span class="pill good">50% / 50%</span></div><div class="distribution">${['Luís Carlos','José Edivaldo'].map((name,i)=>`<div><div class="partner"><div class="partner-icon">${i?'JE':'LC'}</div><span class="partner-name">${name}</span><span class="partner-share">50%</span></div><div class="progress-bg"><div style="width:50%"></div></div></div>`).join('')}<div class="info-note">Resultado operacional atual: <b>${money(net)}</b>.<br/>Referência de 50%: <b>${money(net/2)}</b> para cada sócio. Isso não substitui a apuração contábil do lucro distribuível.</div></div></div></div>`}
function filterRecords(arr,fields){return arr.filter(x=>fields.some(f=>String(x[f]||'').toLowerCase().includes(search.toLowerCase())))}
function renderQuotes(){const records=filterRecords(db.quotes,['customer','vehicle','plate','status']).filter(q=>statusFilter==='all'||q.status===statusFilter).sort((a,b)=>b.id-a.id);
return heading('ATENDIMENTO','Orçamentos','Crie propostas, acompanhe aprovações e compartilhe com clientes.','Novo orçamento','openModal("quote")')+`<div class="panel"><div class="toolbar"><input aria-label="Buscar orçamentos" placeholder="Buscar cliente, placa ou veículo..." oninput="search=this.value;updateTable()" value="${attr(search)}"/><div class="data-actions"><button onclick="statusFilter='all';updateTable()">Todos</button><button onclick="statusFilter='Pendente';updateTable()">Pendentes</button><button onclick="statusFilter='Aprovado';updateTable()">Aprovados</button></div></div><div id="tableArea">${quoteTable(records)}</div></div>`}
function quoteTable(a){return a.length?actions(a,q=>`<tr><td><strong>#${q.id}</strong></td><td>${esc(q.customer)}</td><td>${esc(q.vehicle||'—')}<br/><span class="muted">${esc(q.plate||'')}</span></td><td>${date(q.date)}</td><td><strong>${money(totalQuote(q))}</strong></td><td>${statusHtml(q.status)}</td><td><div class="action-row"><button class="mini-action" onclick="printQuote(${q.id})">PDF</button><button class="mini-action" onclick="shareQuote(${q.id})">WhatsApp</button><button class="mini-action" onclick="updateStatus(${q.id})">Status</button><button class="mini-action danger" onclick="removeRecord('quotes',${q.id})">Excluir</button></div></td></tr>`,[],['Número','Cliente','Moto / Placa','Data','Total','Status','Ações']):empty('Nenhum orçamento encontrado')}
function renderStock(){let a=filterRecords(db.stock,['name','code','supplier']).sort((x,y)=>y.id-x.id);const low=db.stock.filter(s=>Number(s.qty)<=Number(s.minimum)).length;
return heading('ALMOXARIFADO','Controle de estoque','Organize peças, preços, fornecedores e quantidades.','Adicionar peça','openModal("stock")')+`<div class="cards">${metric('Peças cadastradas',db.stock.length,'stock','Produtos diferentes')}${metric('Unidades em estoque',db.stock.reduce((s,i)=>s+Number(i.qty),0),'tool','Somatório de unidades','green')}${metric('Custo total estimado',money(db.stock.reduce((s,i)=>s+Number(i.qty)*Number(i.cost),0)),'money','Custo das peças em estoque','purple')}${metric('Estoque baixo',low,'inspect','Produtos no limite','orange')}</div><div class="panel" style="margin-top:20px"><div class="toolbar"><input placeholder="Buscar por peça, código ou fornecedor..." aria-label="Buscar estoque" value="${attr(search)}" oninput="search=this.value;updateTable()"/></div><div id="tableArea">${stockTable(a)}</div></div>`}
function stockTable(a){return a.length?actions(a,s=>`<tr><td><strong>${esc(s.name)}</strong><br/><span class="muted">${esc(s.code||'')}</span></td><td>${esc(s.supplier||'—')}</td><td>${s.qty}</td><td>${money(s.cost)}</td><td>${money(s.price)}</td><td>${statusHtml(Number(s.qty)<=Number(s.minimum)?'Baixo':'Disponível')}</td><td><div class="action-row"><button class="mini-action" onclick="adjustStock(${s.id})">Ajustar</button><button class="mini-action danger" onclick="removeRecord('stock',${s.id})">Excluir</button></div></td></tr>`,[],['Produto','Fornecedor','Qtde.','Custo un.','Venda un.','Situação','Ações']):empty('Nenhum produto cadastrado')}
function renderMoney(){let a=filterRecords(db.finances,['category','description','type']).sort((x,y)=>y.id-x.id),inflow=db.finances.filter(f=>f.type==='Entrada').reduce((s,f)=>s+Number(f.value),0),outflow=db.finances.filter(f=>f.type==='Saída').reduce((s,f)=>s+Number(f.value),0);return heading('GESTÃO FINANCEIRA','Financeiro','Registre entradas, despesas e acompanhe os números da oficina.','Novo lançamento','openModal("money")')+`<div class="cards">${metric('Entradas',money(inflow),'trend','Recebimentos registrados','green')}${metric('Saídas',money(outflow),'money','Despesas registradas','orange')}${metric('Saldo operacional',money(inflow-outflow),'money','Entradas menos saídas')}${metric('Referência por sócio (50%)',money((inflow-outflow)/2),'clients','Antes de ajustes contábeis','purple')}</div><div class="panel" style="margin-top:20px"><div class="toolbar"><input placeholder="Buscar lançamentos..." aria-label="Buscar lançamentos" value="${attr(search)}" oninput="search=this.value;updateTable()"/></div><div id="tableArea">${moneyTable(a)}</div><div class="info-note">A divisão 50% / 50% é informativa. Para distribuir lucros de verdade, considere impostos, obrigações, dívidas, caixa necessário e retiradas já feitas.</div></div>`}
function moneyTable(a){return a.length?actions(a,f=>`<tr><td>${date(f.date)}</td><td><strong>${esc(f.description)}</strong></td><td>${esc(f.category)}</td><td>${statusHtml(f.type==='Entrada'?'Pago':'Atenção')} ${esc(f.type)}</td><td><strong>${money(f.value)}</strong></td><td><button class="mini-action danger" onclick="removeRecord('finances',${f.id})">Excluir</button></td></tr>`,[],['Data','Descrição','Categoria','Tipo','Valor','Ações']):empty('Nenhum lançamento financeiro')}
function renderInspect(){const a=filterRecords(db.inspections,['model','plate','service','notes','priority']).sort((x,y)=>y.id-x.id);return heading('MÓDULO EXCLUSIVO','Vistorias de motos','Registre estado, serviços feitos e pontos que exigem atenção.','Nova vistoria','openModal("inspect")')+`<div class="cards">${metric('Vistorias registradas',db.inspections.length,'inspect','Histórico total')}${metric('Atenção',db.inspections.filter(x=>x.priority==='Atenção').length,'bike','Revisar quando possível','orange')}${metric('Urgentes',db.inspections.filter(x=>x.priority==='Urgente').length,'inspect','Precisam de prioridade')}${metric('Sem pendências',db.inspections.filter(x=>x.priority==='OK').length,'tool','Tudo em dia','green')}</div><div class="panel" style="margin-top:20px"><div class="toolbar"><input placeholder="Buscar por modelo, placa ou serviço..." aria-label="Buscar vistorias" oninput="search=this.value;updateTable()" value="${attr(search)}"/></div><div id="tableArea">${inspectTable(a)}</div></div>`}
function inspectTable(a){return a.length?actions(a,i=>`<tr><td><strong>${esc(i.model)}</strong><br/><span class="tag">${esc(i.plate)}</span></td><td>${date(i.date)}</td><td>${esc(i.service)}</td><td>${esc(i.status)}</td><td>${statusHtml(i.priority)}</td><td>${esc(i.notes||'—').slice(0,90)}</td><td><button class="mini-action danger" onclick="removeRecord('inspections',${i.id})">Excluir</button></td></tr>`,[],['Moto / Placa','Data','Serviço','Situação','Prioridade','Observações','Ações']):empty('Nenhuma vistoria registrada')}
function renderClients(){let a=filterRecords(db.customers,['name','phone','plate']);return heading('RELACIONAMENTO','Clientes','Cadastre contatos e dados básicos para os atendimentos.','Novo cliente','openModal("clients")')+`<div class="panel"><div class="toolbar"><input aria-label="Buscar clientes" placeholder="Buscar nome, telefone ou placa..." oninput="search=this.value;updateTable()" value="${attr(search)}"/></div><div id="tableArea">${clientsTable(a)}</div></div>`}
function clientsTable(a){return a.length?actions(a,c=>`<tr><td><strong>${esc(c.name)}</strong></td><td>${esc(c.phone||'—')}</td><td>${esc(c.model||'—')}</td><td>${esc(c.plate||'—')}</td><td><button class="mini-action danger" onclick="removeRecord('customers',${c.id})">Excluir</button></td></tr>`,[],['Cliente','Telefone','Veículo','Placa','Ações']):empty('Nenhum cliente cadastrado')}
function renderSettings(){return heading('CONFIGURAÇÕES','Dados e Backup','Proteja seus registros locais e conheça os limites desta versão.')+`<div class="panel"><div class="panel-head"><h2>Faça backup dos seus dados</h2><span class="pill warn">Importante</span></div><p style="line-height:1.8;color:#718da5">Esta versão inicial guarda os dados <b>somente no navegador deste aparelho</b>. Eles não sincronizam com outros celulares nem com os proprietários. Se limpar os dados do navegador ou trocar de aparelho sem exportar o backup, você poderá perdê-los.</p><div class="data-actions"><button onclick="exportBackup()">↓ Exportar backup JSON</button><button onclick="document.getElementById('importInput').click()">↑ Importar backup JSON</button><input type="file" hidden id="importInput" accept=".json,application/json" onchange="importBackup(event)"/><button onclick="resetData()" style="color:#c84f60">Apagar todos os registros</button></div><div class="info-note" style="margin-top:18px"><b>Próximo passo para usar na empresa:</b> configurar autenticação de usuários e banco de dados Supabase, com controle de permissões, backups e sincronização segura. Não registre dados sensíveis de clientes nesta demonstração pública.</div></div><div class="panel" style="margin-top:18px"><div class="panel-head"><h2>Dados dos proprietários</h2></div><div class="distribution"><div class="partner"><div class="partner-icon">LC</div><div class="partner-name">Luís Carlos — 50%</div></div><div class="partner"><div class="partner-icon">JE</div><div class="partner-name">José Edivaldo — 50%</div></div></div></div>`}
function updateTable(){const area=document.getElementById('tableArea');if(!area)return;const r=filterRecords(db[page==='quote'?'quotes':page==='money'?'finances':page==='inspect'?'inspections':page==='clients'?'customers':'stock'],page==='quote'?['customer','vehicle','plate','status']:page==='money'?['category','description','type']:page==='inspect'?['model','plate','service','notes','priority']:page==='clients'?['name','phone','plate']:['name','code','supplier']);area.innerHTML=page==='quote'?quoteTable(r.filter(q=>statusFilter==='all'||q.status===statusFilter).sort((a,b)=>b.id-a.id)):page==='money'?moneyTable(r.sort((a,b)=>b.id-a.id)):page==='inspect'?inspectTable(r.sort((a,b)=>b.id-a.id)):page==='clients'?clientsTable(r):stockTable(r)}
function render(){renderNav();const fn={dashboard:renderDashboard,quote:renderQuotes,stock:renderStock,money:renderMoney,inspect:renderInspect,clients:renderClients,settings:renderSettings}[page];document.getElementById('content').innerHTML=fn()}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function field(name,label,type='text',required=false,placeholder='',value=''){return `<div class="field"><label for="f_${name}">${label}</label><input id="f_${name}" name="${name}" type="${type}" ${required?'required':''} placeholder="${attr(placeholder)}" value="${attr(value)}" ${type==='number'?'min="0" step="0.01"':''}/></div>`}
function choose(name,label,options){return `<div class="field"><label for="f_${name}">${label}</label><select id="f_${name}" name="${name}">${options.map(x=>`<option value="${attr(x)}">${esc(x)}</option>`).join('')}</select></div>`}
function textArea(name,label){return `<div class="field"><label for="f_${name}">${label}</label><textarea id="f_${name}" name="${name}" placeholder="Observações adicionais..."></textarea></div>`}
let modalType='';
function openModal(type){modalType=type;let title='',body='';if(type==='quote'){title='Novo orçamento';body=`<div class="form-grid">${field('customer','Nome do cliente','text',true,'Ex.: Ana Silva')}${field('phone','WhatsApp (com DDD)','tel',false,'85999999999')}${field('vehicle','Modelo da moto / veículo','text',true,'Ex.: Honda CG 160')}${field('plate','Placa','text',false,'ABC1D23')}${field('date','Data','date',true,'',now())}${choose('status','Situação',['Pendente','Aprovado','Concluído','Reprovado'])}</div><div class="panel-head" style="margin-top:13px"><h2>Serviços e peças</h2><button type="button" class="btn btn-small btn-light" onclick="addLine()">+ Item</button></div><div class="list-items" id="quoteItems"></div><div class="form-grid" style="margin-top:13px">${field('discount','Desconto (R$)','number',false,'0','0')}</div><div class="total-bar"><b>Total do orçamento</b><b id="quoteTotal">R$ 0,00</b></div>${textArea('notes','Observações / Prazo')}`}
else if(type==='stock'){title='Cadastrar peça';body=`<div class="form-grid">${field('name','Nome da peça','text',true,'Ex.: Óleo 10W30')}${field('code','Código/SKU','text',false,'Ex.: OLE-001')}${field('supplier','Fornecedor','text',false,'Nome do fornecedor')}${field('qty','Quantidade atual','number',true,'0','0')}${field('minimum','Estoque mínimo','number',true,'2','2')}${field('cost','Custo por unidade (R$)','number',true,'0','0')}${field('price','Preço de venda (R$)','number',true,'0','0')}</div>`}
else if(type==='money'){title='Novo lançamento';body=`<div class="form-grid">${choose('type','Tipo',['Entrada','Saída'])}${field('date','Data','date',true,'',now())}${field('description','Descrição','text',true,'Ex.: Serviço de revisão')}${choose('category','Categoria',['Serviços','Peças','Fornecedores','Aluguel','Funcionários','Ferramentas','Impostos','Outros'])}${field('value','Valor (R$)','number',true,'0','0')}</div>`}
else if(type==='inspect'){title='Nova vistoria de moto';body=`<div class="form-grid">${field('model','Modelo da moto','text',true,'Ex.: Honda Biz 125')}${field('plate','Placa','text',true,'ABC1D23')}${field('date','Data da vistoria','date',true,'',now())}${choose('status','Serviço',['A fazer','Em andamento','Realizado'])}${choose('priority','Prioridade',['OK','Atenção','Urgente'])}</div>${field('service','Serviço realizado / previsto','text',true,'Ex.: Troca de óleo e revisão dos freios')}${textArea('notes','Pontos de atenção')}<div class="field"><label>Itens verificados (opcional)</label><div class="check-grid">${['Freios','Pneus','Óleo do motor','Iluminação','Corrente','Suspensão','Bateria','Documentação'].map(x=>`<label class="check-option"><input type="checkbox" name="check" value="${x}"/> ${x}</label>`).join('')}</div></div>`}
else if(type==='clients'){title='Novo cliente';body=`<div class="form-grid">${field('name','Nome completo','text',true,'Nome do cliente')}${field('phone','Telefone / WhatsApp','tel',false,'85999999999')}${field('model','Modelo da moto','text',false,'Ex.: Yamaha Factor')}${field('plate','Placa','text',false,'ABC1D23')}</div>`}
document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-header"><div><h2>${title}</h2><p class="modal-subtitle">Preencha os dados abaixo para registrar.</p></div><button type="button" class="modal-close" onclick="closeModal()" aria-label="Fechar">×</button></div><form id="dataForm" onsubmit="submitForm(event)">${body}<div class="modal-footer"><button type="button" class="btn btn-outline" onclick="closeModal()">Cancelar</button><button type="submit" class="btn btn-primary">Salvar registro</button></div></form></div></div>`;if(type==='quote'){addLine();setTimeout(()=>{document.getElementById('f_discount')?.addEventListener('input',updateQuoteTotal)},0)}}
function addLine(){const row=document.createElement('div');row.className='line-item';row.innerHTML=`<div class="field"><label>Descrição</label><input class="line-name" required placeholder="Serviço ou peça"/></div><div class="field"><label>Qtd.</label><input class="line-qty" type="number" min="0.01" step="0.01" required value="1" oninput="updateQuoteTotal()"/></div><div class="field"><label>Valor (R$)</label><input class="line-price" type="number" min="0" step="0.01" required value="0" oninput="updateQuoteTotal()"/></div><button type="button" onclick="this.closest('.line-item').remove();updateQuoteTotal()" aria-label="Remover item">×</button>`;document.getElementById('quoteItems').appendChild(row);updateQuoteTotal()}
function getItems(){return [...document.querySelectorAll('.line-item')].map(row=>({name:row.querySelector('.line-name').value.trim(),qty:Number(row.querySelector('.line-qty').value),price:Number(row.querySelector('.line-price').value)}))}
function updateQuoteTotal(){const el=document.getElementById('quoteTotal');if(el)el.textContent=money(getItems().reduce((a,x)=>a+x.qty*x.price,0)-Number(document.getElementById('f_discount')?.value||0))}
function submitForm(e){e.preventDefault();const f=new FormData(e.target),v=Object.fromEntries(f.entries()),record={...v,id:id()};if(modalType==='quote'){const items=getItems();if(!items.length||items.some(x=>!x.name||x.qty<=0)){toast('Adicione pelo menos um item válido.');return}record.items=items;record.discount=Number(v.discount||0);if(totalQuote(record)<0){toast('O desconto não pode superar o valor do orçamento.');return}}
if(modalType==='stock'){for(const k of ['qty','minimum','cost','price'])record[k]=Number(v[k])}
if(modalType==='money')record.value=Number(v.value);
if(modalType==='inspect')record.checks=[...e.target.querySelectorAll('[name=check]:checked')].map(x=>x.value);
const dataset={quote:'quotes',stock:'stock',money:'finances',inspect:'inspections',clients:'customers'}[modalType];db[dataset].push(record);save();closeModal();goto(modalType);toast('Registro salvo neste navegador!')}
function removeRecord(dataset,identifier){if(!confirm('Excluir este registro? Esta ação não pode ser desfeita.'))return;db[dataset]=db[dataset].filter(x=>x.id!==identifier);save();render();toast('Registro excluído.')}
function adjustStock(identifier){const obj=db.stock.find(x=>x.id===identifier);if(!obj)return;const next=prompt('Nova quantidade em estoque para '+obj.name+':',obj.qty);if(next===null)return;const n=Number(next.replace(',','.'));if(!Number.isFinite(n)||n<0){toast('Informe uma quantidade válida.');return}obj.qty=n;save();render();toast('Estoque atualizado!')}
function updateStatus(identifier){const obj=db.quotes.find(x=>x.id===identifier);if(!obj)return;const list=['Pendente','Aprovado','Concluído','Reprovado'];const s=prompt('Novo status: Pendente, Aprovado, Concluído ou Reprovado',obj.status);if(s===null)return;const normalized=list.find(x=>x.toLowerCase()===s.trim().toLowerCase());if(!normalized){toast('Status inválido.');return}obj.status=normalized;save();render();toast('Status atualizado!')}
function getQuote(i){return db.quotes.find(q=>q.id===i)}
function quoteText(q){return `*LC OFICINA — ORÇAMENTO #${q.id}*\nCliente: ${q.customer}\nVeículo: ${q.vehicle}\nPlaca: ${q.plate||'Não informada'}\nData: ${date(q.date)}\n\n`+q.items.map(i=>`• ${i.name}: ${i.qty} × ${money(i.price)} = ${money(i.qty*i.price)}`).join('\n')+`\n\nDesconto: ${money(q.discount)}\n*TOTAL: ${money(totalQuote(q))}*\nSituação: ${q.status}\n${q.notes?'\nObs.: '+q.notes:''}`}
function shareQuote(i){const q=getQuote(i);if(!q)return;let phone=String(q.phone||'').replace(/\D/g,'');if(phone.length===10||phone.length===11)phone='55'+phone;const url=`https://wa.me/${phone}?text=${encodeURIComponent(quoteText(q))}`;window.open(url,'_blank','noopener,noreferrer')}
function printQuote(i){const q=getQuote(i);if(!q)return;const lines=q.items.map(item=>`<tr><td>${esc(item.name)}</td><td>${esc(item.qty)}</td><td>${money(item.price)}</td><td>${money(item.qty*item.price)}</td></tr>`).join('');document.getElementById('printSheet').innerHTML=`<header><div><h1>LC OFICINA</h1><div>Gestão inteligente de serviços</div></div><div style="text-align:right"><b>ORÇAMENTO Nº ${q.id}</b><br/>Data: ${date(q.date)}<br/>Status: ${esc(q.status)}</div></header><div class="block"><b>CLIENTE:</b> ${esc(q.customer)}<br/><b>CONTATO:</b> ${esc(q.phone||'—')}<br/><b>MOTO / VEÍCULO:</b> ${esc(q.vehicle)}<br/><b>PLACA:</b> ${esc(q.plate||'—')}</div><div class="block"><table><thead><tr><th>DESCRIÇÃO</th><th>QTD.</th><th>UNITÁRIO</th><th>SUBTOTAL</th></tr></thead><tbody>${lines}</tbody></table><div class="print-total">Desconto: ${money(q.discount)}<br/>TOTAL: ${money(totalQuote(q))}</div></div><div class="block"><b>OBSERVAÇÕES:</b><br/>${esc(q.notes||'Sem observações adicionais.')}</div><footer>LC Oficina · Proposta de orçamento · Valores sujeitos à aprovação</footer>`;setTimeout(()=>window.print(),120)}
function exportBackup(){const blob=new Blob([JSON.stringify({app:'LC Oficina',version:1,date:new Date().toISOString(),data:db},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`LC-Oficina-Backup-${now()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Backup baixado! Guarde em local seguro.')}
function importBackup(e){const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(String(reader.result));const dat=parsed.data;if(!dat||!['customers','quotes','stock','finances','inspections'].every(k=>Array.isArray(dat[k])))throw Error('Formato incorreto');if(!confirm('Substituir todos os registros atuais pelos do backup?'))return;db=dat;save();render();toast('Backup importado!')}catch(err){toast('Arquivo de backup inválido.')}finally{e.target.value=''}};reader.readAsText(file)}
function resetData(){if(!confirm('Tem certeza que deseja APAGAR TODOS os registros deste navegador?'))return;if(!confirm('Esta ação não pode ser desfeita. Confirma?'))return;db=newDB();save();goto('dashboard');toast('Registros apagados.')}
render();
</script>
</body></html>
